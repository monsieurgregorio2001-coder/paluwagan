name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOUSE_DIR: ${{ github.workspace }}/hub
    steps:
      - uses: actions/checkout@v4
      # House 2.0.0, pinned by commit because tags cannot be created yet. Public repo, no secret.
      - uses: actions/checkout@v4
        with:
          repository: monsieurgregorio2001-coder/monsieurgregorio2001-coder.github.io
          ref: 8938fa639a4edab03948da56d69fc0a50f7f94ae
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run house:check
      - run: npm run typecheck
      - run: npm run build
      # Runs the tests, checks the JS budget, writes dist/evidence.json. Fails the job on either.
      - run: npm run evidence
      - run: npm run evidence:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
